<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Store Admin — KELTO</title>
<link rel="icon" href="../img/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- ============== LOGIN ============== -->
<div id="login-gate" class="admin-login">
  <div class="admin-login-box">
    <div class="brand" style="justify-content:center; margin-bottom:22px;">
      <img src="../img/logo.png" style="height:40px;">
      <span>Admin</span>
    </div>
    <div class="field">
      <label>Backend URL</label>
      <input type="text" id="backend-url-input" placeholder="https://your-backend.onrender.com">
    </div>
    <div class="field">
      <label>Admin token</label>
      <input type="password" id="admin-token-input" placeholder="Your ADMIN_TOKEN from the backend .env">
      <div class="err" id="login-err" style="display:none;">Wrong admin token, or the backend couldn't be reached.</div>
    </div>
    <button class="btn btn-primary btn-block" id="login-btn">Enter dashboard</button>
    <p class="note" style="margin-top:18px;">This panel talks to your backend server (see <code>/backend</code>). Enter its deployed URL and the <code>ADMIN_TOKEN</code> you set on Render.</p>
  </div>
</div>

<!-- ============== DASHBOARD SHELL ============== -->
<div id="app" class="admin-app" style="display:none;">
  <aside class="admin-side" id="admin-side">
    <div class="admin-logo">
      <img src="../img/logo.png">
      <div>KELTO<span>Admin console</span></div>
    </div>
    <nav class="admin-nav" id="admin-nav">
      <button data-page="dashboard" class="active">Dashboard</button>
      <button data-page="orders">Orders</button>
      <button data-page="products">Products</button>
      <button data-page="categories">Categories</button>
      <button data-page="customers">Customers</button>
      <button data-page="discounts">Discounts</button>
      <button data-page="settings">Settings</button>
    </nav>
    <a href="../index.html" class="btn btn-outline btn-block" style="margin-top:auto;">&larr; View store</a>
  </aside>

  <main class="admin-main">
    <header class="admin-top">
      <button class="admin-menu-toggle" id="admin-menu-toggle" aria-label="Menu">&#9776;</button>
      <input class="admin-search" id="admin-search" placeholder="Search this page…">
      <div class="admin-conn" id="admin-conn"></div>
      <button class="btn btn-outline" id="logout-btn">Log out</button>
    </header>
    <section class="admin-content" id="admin-content"></section>
  </main>
</div>

<div id="admin-modal" class="admin-modal hidden"></div>
<div id="admin-toast" class="toast"></div>

<script src="../js/config.js"></script>
<script src="admin.js"></script>
</body>
</html>
