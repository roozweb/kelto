<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart — KELTO</title>
<link rel="icon" href="img/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="">

<header class="site-header" id="site-header"></header>

<section class="section" style="padding-top:40px;">
  <div class="wrap">
    <a href="index.html" class="back-link">&larr; Continue Shopping</a>
    <h2 style="margin-bottom:26px;">Your Cart</h2>
    <div id="cart-body"></div>
  </div>
</section>

<footer id="site-footer"></footer>

<script src="js/config.js"></script>
<script src="js/products.js"></script>
<script src="js/main.js"></script>
<script>
  function render(){
    const lines = cartLinesResolved();
    const body = document.getElementById('cart-body');

    if(lines.length === 0){
      body.innerHTML = `
        <div class="empty-state">
          <div class="display">Your cart is empty</div>
          <p>Looks like you haven't added anything yet.</p>
          <a href="index.html" class="btn btn-primary" style="margin-top:18px;">Start shopping</a>
        </div>`;
      return;
    }

    const subtotal = cartSubtotal();
    const shipping = subtotal >= STORE.freeShippingOver ? 0 : 79;
    const total = subtotal + shipping;

    body.innerHTML = `
      <div class="cart-layout">
        <div>
          ${lines.map(l => `
            <div class="cart-line" data-pid="${l.productId}" data-size="${l.size}">
              <a href="product.html?id=${l.productId}" class="thumb">
                ${l.product.img ? `<img src="${l.product.img}" alt="${l.product.name}">` : `<div class="ph">K</div>`}
              </a>
              <div>
                <a href="product.html?id=${l.productId}" class="name">${l.product.name}</a>
                <div class="attrs">Size: ${l.size}</div>
                <div class="price">${fmtPrice(l.product.price)}</div>
                <div class="qty-box" style="margin-top:10px;">
                  <button type="button" class="qty-minus">−</button>
                  <span>${l.qty}</span>
                  <button type="button" class="qty-plus">+</button>
                </div>
              </div>
              <div class="line-actions">
                <div style="font-weight:700;">${fmtPrice(l.product.price * l.qty)}</div>
                <button class="remove-btn" type="button">Remove</button>
              </div>
            </div>
          `).join('')}
        </div>
        <div class="summary-card">
          <div class="summary-row"><span>Subtotal</span><span>${fmtPrice(subtotal)}</span></div>
          <div class="summary-row"><span>Shipping</span><span>${shipping === 0 ? 'Free' : fmtPrice(shipping)}</span></div>
          ${shipping > 0 ? `<div class="summary-row" style="font-size:12px;">Add ${fmtPrice(STORE.freeShippingOver - subtotal)} more for free shipping</div>` : ''}
          <div class="summary-row total"><span>Total</span><span>${fmtPrice(total)}</span></div>
          <button class="btn btn-primary btn-block" id="checkout-btn" style="margin-top:16px;">Buy Now</button>
        </div>
      </div>`;

    body.querySelectorAll('.cart-line').forEach(row => {
      const pid = row.dataset.pid, size = row.dataset.size;
      row.querySelector('.qty-minus').addEventListener('click', () => {
        const cart = getCart();
        const line = cart.find(l => l.productId===pid && l.size===size);
        setCartQty(pid, size, line.qty - 1);
        render();
      });
      row.querySelector('.qty-plus').addEventListener('click', () => {
        const cart = getCart();
        const line = cart.find(l => l.productId===pid && l.size===size);
        setCartQty(pid, size, line.qty + 1);
        render();
      });
      row.querySelector('.remove-btn').addEventListener('click', () => {
        removeFromCart(pid, size);
        render();
      });
    });

    document.getElementById('checkout-btn').addEventListener('click', () => {
      location.href = 'checkout.html';
    });
  }

  KELTO_READY.then(render);
</script>
</body>
</html>
